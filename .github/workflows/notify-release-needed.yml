name: Notify — Release Needed

on:
  push:
    branches: ["main"]
    paths:
      - "org-policy-template.md"
      - "repo-policy-template.md"

jobs:
  open-issue:
    name: Open or update release-needed issue
    runs-on: ubuntu-latest

    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Determine changed files
        id: changed
        run: |
          FILES=$(git diff --name-only HEAD~1 HEAD -- org-policy-template.md repo-policy-template.md | tr '\n' ' ')
          echo "files=$FILES" >> "$GITHUB_OUTPUT"

      - name: Open or update issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHANGED: ${{ steps.changed.outputs.files }}
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          LABEL="release-needed"
          TITLE="Release needed: policy templates updated"

          # Ensure label exists
          gh label create "$LABEL" \
            --description "Policy templates changed; PDFs need regenerating" \
            --color "E4E669" 2>/dev/null || true

          # Check for an existing open issue with this label
          EXISTING=$(gh issue list \
            --label "$LABEL" \
            --state open \
            --json number \
            --jq '.[0].number' 2>/dev/null || echo "")

          BODY="### Policy templates changed — new release required

The following template file(s) were updated on \`main\` and the PDFs need to be regenerated:

$(echo "$CHANGED" | tr ' ' '\n' | grep -v '^$' | sed 's/^/- `/' | sed 's/$/`/')

**Commit:** [$COMMIT_SHA]($COMMIT_URL)
**Workflow run:** $RUN_URL

#### To close this issue, publish a new release:

\`\`\`bash
git tag 1.x.y
git push origin 1.x.y
\`\`\`

The \`generate-pdfs\` workflow will build the PDFs, attach them to the release, and automatically close this issue."

          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" \
              --body "**Updated:** Additional changes pushed in [$COMMIT_SHA]($COMMIT_URL). PDFs still need regenerating."
            echo "Updated existing issue #$EXISTING"
          else
            gh issue create \
              --title "$TITLE" \
              --body "$BODY" \
              --label "$LABEL"
            echo "Created new issue"
          fi
