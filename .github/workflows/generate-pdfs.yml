name: Generate PDFs

on:
  push:
    tags:
      - "[0-9]*.[0-9]*.[0-9]*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version string (e.g. 1.2.0)"
        required: false
        default: ""

jobs:
  generate-pdfs:
    name: Generate PDFs and publish release
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Resolve version
        id: version
        run: |
          TAG="$GITHUB_REF_NAME"
          INPUT="${{ github.event.inputs.version }}"
          SEMVER='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*|[0-9]*[a-zA-Z-][0-9a-zA-Z-]*)(\.(0|[1-9][0-9]*|[0-9]*[a-zA-Z-][0-9a-zA-Z-]*))*))?(\+[0-9a-zA-Z-]+(\.[0-9a-zA-Z-]+)*)?$'
          if [ -n "$INPUT" ]; then
            VERSION="$INPUT"
          elif echo "$TAG" | grep -qE "$SEMVER"; then
            VERSION="$TAG"
          else
            VERSION=""
          fi
          DATE=$(date +%Y-%m-%d)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "date=$DATE" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $VERSION  date: $DATE"

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Generate PDFs
        run: |
          ARGS=(--output-dir dist --date "${{ steps.version.outputs.date }}")
          if [ -n "${{ steps.version.outputs.version }}" ]; then
            ARGS+=(--version "${{ steps.version.outputs.version }}")
          fi
          python scripts/convert_templates_to_pdf.py "${ARGS[@]}"

      - name: Create GitHub Release and upload PDFs
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && steps.version.outputs.version != '')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || steps.version.outputs.version }}"
          ARGS=()
          if echo "$TAG" | grep -q '-'; then
            ARGS+=(--prerelease)
          fi
          gh release create "$TAG" dist/*.pdf \
            --generate-notes \
            "${ARGS[@]}"
